<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Inventario | POS Sory</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .stock-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85em; }
        .stock-bien { background: rgba(40, 167, 69, 0.7); }
        .stock-bajo { background: rgba(255, 193, 7, 0.8); color: #212529; }
        .stock-nulo { background: rgba(220, 53, 69, 0.7); }
        
        .diferencia-alerta { color: #ff6666; animation: blink 2s infinite; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .paginacion-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        .btn-pag { width: auto; padding: 8px 15px; min-width: 100px; }
    </style>
</head>
<body>
    <div class="glass-container">
        <div class="nav-bar">
            <a href="index.html">Menú</a> |
            <a href="productos.html">Productos</a> |
            <a href="venta.html">Venta</a> |
            <a href="reportes.html">Reportes</a>
        </div>

        <h2>📋 Auditoría de Inventario (Pre-Inventario)</h2>

        <div class="glass-panel" style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="buscadorInventario" class="glass-input" placeholder="🔍 Buscar por nombre o categoría..." style="margin-bottom: 0; flex: 1;">
            
            <button id="btnGuardarInventario" class="glass-button" style="width: auto; margin-top: 0; background: rgba(0, 123, 255, 0.4);">
                💾 Guardar Conteo y Actualizar Stock
            </button>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Producto / Cat.</th>
                        <th>Estado</th>
                        <th>Sistema (Teórico)</th>
                        <th>Físico (Conteo)</th>
                        <th>Diferencia</th>
                    </tr>
                </thead>
                <tbody id="tablaInventario">
                    <tr><td colspan="5" style="text-align:center;">Cargando productos...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="paginacion-container">
            <button id="btnAnt" class="glass-button btn-pag">⬅️ Anterior</button>
            <span id="infoPag" style="font-weight: bold;">Página 1</span>
            <button id="btnSig" class="glass-button btn-pag">Siguiente ➡️</button>
        </div>
    </div>

    <script type="module">
        import { 
            db, collection, getDocs, addDoc, updateDoc, doc, query, orderBy 
        } from './firebase_init.js'; 

        const productosRef = collection(db, "productos");
        const auditoriaRef = collection(db, "inventario_auditoria");

        let productosMemoria = [];
        let productosFiltrados = [];
        let paginaActual = 1;
        const itemsPorPagina = 10;

        document.addEventListener('DOMContentLoaded', () => {
            cargarInventario();
            document.getElementById('buscadorInventario').addEventListener('input', filtrarInventario);
            document.getElementById('btnGuardarInventario').addEventListener('click', guardarConteo);
            document.getElementById('btnAnt').addEventListener('click', () => cambiarPagina(-1));
            document.getElementById('btnSig').addEventListener('click', () => cambiarPagina(1));
        });

        async function cargarInventario() {
            try {
                const snapshot = await getDocs(query(productosRef, orderBy("nombre", "asc")));
                productosMemoria = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                productosFiltrados = [...productosMemoria];
                renderizarTabla();
            } catch (e) { console.error(e); }
        }

        function renderizarTabla() {
            const tabla = document.getElementById('tablaInventario');
            tabla.innerHTML = '';

            const inicio = (paginaActual - 1) * itemsPorPagina;
            const fin = inicio + itemsPorPagina;
            const totalPaginas = Math.ceil(productosFiltrados.length / itemsPorPagina) || 1;
            const dataPagina = productosFiltrados.slice(inicio, fin);

            dataPagina.forEach(p => {
                const stock = parseInt(p.stock || 0);
                let clase = "stock-bien";
                if (stock <= 0) clase = "stock-nulo";
                else if (stock <= 5) clase = "stock-bajo";

                const fila = tabla.insertRow();
                fila.dataset.id = p.id;
                fila.dataset.nombre = p.nombre;
                fila.innerHTML = `
                    <td>
                        <strong>${p.nombre}</strong><br>
                        <small style="opacity:0.7">${p.categoria || 'Sin categoría'}</small>
                    </td>
                    <td><span class="stock-badge ${clase}">${stock <= 0 ? 'Agotado' : 'Disponible'}</span></td>
                    <td style="text-align:center;">${stock}</td>
                    <td>
                        <input type="number" class="glass-input input-fisico" style="width:80px; margin-bottom:0;" 
                               placeholder="0" oninput="window.calcularDiferencia(this, ${stock})">
                    </td>
                    <td class="diff-val" style="text-align:center; font-weight:bold;">-</td>
                `;
            });

            document.getElementById('infoPag').textContent = `Página ${paginaActual} de ${totalPaginas}`;
            document.getElementById('btnAnt').disabled = paginaActual === 1;
            document.getElementById('btnSig').disabled = paginaActual >= totalPaginas;

            if (productosFiltrados.length === 0) {
                tabla.innerHTML = '<tr><td colspan="5" style="text-align:center;">No se encontraron productos</td></tr>';
            }
        }

        function cambiarPagina(dir) {
            paginaActual += dir;
            renderizarTabla();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filtrarInventario(e) {
            const t = e.target.value.toLowerCase().trim();
            productosFiltrados = productosMemoria.filter(p => 
                p.nombre.toLowerCase().includes(t) || 
                (p.categoria && p.categoria.toLowerCase().includes(t))
            );
            paginaActual = 1;
            renderizarTabla();
        }

        window.calcularDiferencia = function(input, esperado) {
            const fisico = parseInt(input.value);
            const celdaDiff = input.parentElement.nextElementSibling;
            if (isNaN(fisico)) {
                celdaDiff.textContent = "-";
                celdaDiff.classList.remove("diferencia-alerta");
                return;
            }
            const diff = fisico - esperado;
            celdaDiff.textContent = diff > 0 ? `+${diff}` : diff;
            celdaDiff.style.color = diff === 0 ? "#aaffaa" : "#ff6666";
            if (diff !== 0) celdaDiff.classList.add("diferencia-alerta");
            else celdaDiff.classList.remove("diferencia-alerta");
        };

        async function guardarConteo() {
            const filas = document.querySelectorAll('#tablaInventario tr');
            const detalles = [];
            const fecha = new Date().toLocaleString();
            
            const btn = document.getElementById('btnGuardarInventario');
            btn.disabled = true;
            btn.textContent = "⏳ Procesando y Actualizando...";

            try {
                // Usamos un bucle para poder usar await en cada actualización
                for (const fila of filas) {
                    const fisicoInput = fila.querySelector('.input-fisico');
                    
                    if (fisicoInput && fisicoInput.value !== "") {
                        const idProducto = fila.dataset.id;
                        const stockNuevo = parseInt(fisicoInput.value);
                        const stockSistema = parseInt(fila.cells[2].textContent);

                        // 1. Guardamos el detalle para el historial
                        detalles.push({
                            producto: fila.dataset.nombre,
                            id_producto: idProducto,
                            sistema: stockSistema,
                            fisico: stockNuevo,
                            diferencia: stockNuevo - stockSistema
                        });

                        // 2. ACTUALIZAMOS EL STOCK REAL EN LA BASE DE DATOS
                        const productoDoc = doc(db, "productos", idProducto);
                        await updateDoc(productoDoc, {
                            stock: stockNuevo
                        });
                    }
                }

                if (detalles.length === 0) {
                    alert("Por favor, ingresa al menos un conteo físico.");
                    btn.disabled = false;
                    btn.textContent = "💾 Guardar Conteo y Actualizar Stock";
                    return;
                }

                // Guardamos el registro de la auditoría
                await addDoc(auditoriaRef, {
                    fecha: fecha,
                    detalles: detalles
                });

                alert("✅ ¡Éxito! El stock ha sido actualizado en el sistema.");
                location.reload(); 
            } catch (e) {
                alert("Error al guardar: " + e.message);
                btn.disabled = false;
                btn.textContent = "💾 Guardar Conteo y Actualizar Stock";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Caja</title>
    
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <div class="glass-container">
        
        <div class="nav-bar">
            <a href="index.html">Menú</a> |
            <a href="venta.html">Venta</a> |
            <a href="productos.html">Productos</a> |
            <a href="reportes.html">Reportes</a>
        </div>

        <h2>🏦 Control de Caja y Cortes</h2>

        <div id="estadoCaja" class="glass-panel" style="text-align: center;">
            <h3>Cargando estado...</h3>
        </div>

        <div id="seccionAbrir" class="glass-panel" style="display: none; max-width: 400px; margin: 0 auto;">
            <h3 style="border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom:10px;">Abrir Nueva Sesión</h3>
            <form id="formAbrirCaja">
                <label>Monto Inicial (Fondo):</label>
                <input type="number" step="0.01" id="monto_inicial_abrir" name="monto_inicial" value="0.00" class="glass-input" required>
                <button type="submit" class="glass-button" style="width: 100%;">💰 Iniciar Caja</button>
            </form>
        </div>

        <div id="seccionCerrar" class="glass-panel" style="display: none; max-width: 400px; margin: 0 auto;">
            <h3 style="border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom:10px;">Cierre de Caja (Corte)</h3>
            
            <div style="text-align: left; margin-bottom: 20px; font-size: 0.95em;">
                <p>Apertura: <strong id="cierre_fecha_apertura" style="color: #aaffaa;"></strong></p>
                <p>Monto Inicial: $<strong id="cierre_monto_inicial"></strong></p>
                <p>Ventas de ESTA Sesión: $<strong id="cierre_total_vendido"></strong> (<span id="cierre_num_ventas"></span> ventas)</p>
                <hr style="border: 0; border-top: 1px dashed rgba(255,255,255,0.3);">
                <p style="font-size: 1.1em;">TOTAL ESPERADO: $<strong id="cierre_total_esperado" style="color: #87ceeb;"></strong></p>
            </div>
            
            <form id="formCerrarCaja">
                <input type="hidden" id="cierre_doc_id" name="doc_id">
                <input type="hidden" id="cierre_monto_sistema_hidden" name="monto_sistema">
                <input type="hidden" id="cierre_monto_inicial_hidden" name="monto_inicial">

                <label>Monto Contado Físico (Lo que hay en el cajón):</label>
                <input type="number" step="0.01" id="monto_contado_cerrar" name="monto_contado" class="glass-input" required placeholder="0.00">
                <button type="submit" class="glass-button glass-button-danger" style="width: 100%;">🔒 Cerrar Caja y Registrar Corte</button>
            </form>
        </div>

        <script type="module">
            import { 
                db, collection, addDoc, getDocs, updateDoc, doc, query, where, orderBy, limit 
            } from './firebase_init.js'; 

            const cajasRef = collection(db, "cajas");
            const ventasRef = collection(db, "ventas");

            document.addEventListener('DOMContentLoaded', () => {
                verificarEstadoCaja();
                document.getElementById('formAbrirCaja').addEventListener('submit', abrirCaja);
                document.getElementById('formCerrarCaja').addEventListener('submit', cerrarCaja);
            });

            // --- FUNCIÓN CLAVE: CONVERTIR TEXTO A FECHA PARA COMPARAR ---
            function parsearFecha(fechaStr) {
                // Formato esperado: "25/12/2025, 8:15:51 p.m." (o similar según tu navegador)
                try {
                    // Limpiamos un poco el string por si acaso
                    if (!fechaStr) return new Date(0); // Fecha muy antigua si es nulo
                    
                    // Si el navegador guardó ISO string (ej: 2025-12-25T20:15:00...), es fácil
                    if (fechaStr.includes('T')) return new Date(fechaStr);

                    // Si es formato local (con barras y comas)
                    // Esta es una aproximación robusta para formato dd/mm/yyyy
                    const partes = fechaStr.split(','); // Separar fecha de hora
                    const fechaPartes = partes[0].trim().split('/');
                    
                    if (fechaPartes.length !== 3) return new Date(fechaStr); // Intentar nativo si falla split

                    const dia = parseInt(fechaPartes[0]);
                    const mes = parseInt(fechaPartes[1]) - 1; // Meses en JS son 0-11
                    const anio = parseInt(fechaPartes[2]);

                    // Manejo básico de hora si es necesario, pero para comparar ventas vs apertura
                    // la fecha y hora son vitales. Vamos a confiar en el constructor nativo primero
                    // porque el formato local depende de TU navegador.
                    
                    // MEJOR ESTRATEGIA: Convertir el string local a objeto Date directamente
                    // ya que se guardó con .toLocaleString() en la misma máquina/región.
                    return new Date(Date.parse(fechaStr.replace('p. m.', 'PM').replace('a. m.', 'AM')));
                    
                } catch (e) {
                    console.error("Error al parsear fecha:", fechaStr, e);
                    return new Date(0);
                }
            }
            // -----------------------------------------------------------

            async function verificarEstadoCaja() {
                const estadoDiv = document.getElementById('estadoCaja');
                estadoDiv.innerHTML = '<h3>Cargando estado...</h3>';
                
                try {
                    // 1. Buscar caja ABIERTA
                    const q = query(cajasRef, where("fecha_cierre", "==", null), orderBy("fecha_apertura", "desc"), limit(1));
                    const snapshotCaja = await getDocs(q);
                    
                    if (snapshotCaja.empty) {
                        mostrarSeccionCajaCerrada();
                        return;
                    }
                    
                    const cajaDoc = snapshotCaja.docs[0];
                    const cajaData = cajaDoc.data();
                    const cajaDocId = cajaDoc.id;

                    // FECHA REAL DE APERTURA (Convertida a objeto para comparar)
                    // Usamos Date.parse directo porque toLocaleString suele ser compatible con el mismo navegador
                    // Pero limpiamos el formato AM/PM por si acaso chrome lo pone en español
                    let fechaAperturaObj = new Date(cajaData.fecha_apertura_iso || new Date().toISOString()); 
                    
                    // Si no guardaste fecha_apertura_iso antes, intentamos parsear el string
                    if (!cajaData.fecha_apertura_iso) {
                        // Fallback crítico: Tratamos de interpretar el string guardado
                        const rawDate = cajaData.fecha_apertura.replace(/\./g, '').toUpperCase(); // Quitar puntos de p.m.
                        fechaAperturaObj = new Date(rawDate);
                        
                        // Si da fecha inválida, usamos la hora actual para no bloquear, pero avisamos
                        if (isNaN(fechaAperturaObj)) {
                            console.warn("Fecha inválida, asumiendo todas las ventas huérfanas son de hoy.");
                            fechaAperturaObj = new Date(0); // Aceptará todo
                        }
                    }

                    // 2. BUSCAR VENTAS SIN CORTE
                    const qVentas = query(ventasRef, where("id_corte", "==", null));
                    const snapshotVentas = await getDocs(qVentas);

                    let totalVendido = 0;
                    let numVentas = 0;

                    snapshotVentas.forEach(doc => {
                        const ventaData = doc.data();
                        
                        // --- AQUÍ ESTÁ EL FILTRO MÁGICO ---
                        // Solo sumamos si la fecha de la venta es MAYOR a la apertura de la caja
                        let fechaVentaObj;
                        if (ventaData.fecha_iso) {
                             fechaVentaObj = new Date(ventaData.fecha_iso);
                        } else {
                             // Fallback para datos viejos
                             const rawVenta = (ventaData.fecha_hora || "").replace(/\./g, '').toUpperCase();
                             fechaVentaObj = new Date(rawVenta);
                        }

                        // Comparamos timestamps
                        if (!isNaN(fechaVentaObj) && !isNaN(fechaAperturaObj)) {
                            if (fechaVentaObj >= fechaAperturaObj) {
                                totalVendido += parseFloat(ventaData.total_venta || 0);
                                numVentas++;
                            }
                        } else {
                            // Si no podemos comparar fechas, sumamos por defecto (comportamiento viejo)
                            // o lo ignoramos. Mejor sumar para no perder dinero.
                            totalVendido += parseFloat(ventaData.total_venta || 0);
                            numVentas++;
                        }
                    });

                    const montoInicial = parseFloat(cajaData.monto_inicial || 0);
                    const totalEsperado = montoInicial + totalVendido;

                    renderizarCajaAbierta(cajaDocId, cajaData, totalVendido, totalEsperado, numVentas);

                } catch (error) {
                    console.error(error);
                    estadoDiv.innerHTML = `<p style="color:#ff6666;">Error: ${error.message}</p>`;
                }
            }
            
            function mostrarSeccionCajaCerrada() {
                const estadoDiv = document.getElementById('estadoCaja');
                estadoDiv.style.background = "rgba(255, 100, 100, 0.2)";
                estadoDiv.style.border = "1px solid rgba(255, 100, 100, 0.4)";
                estadoDiv.innerHTML = `<h3>❌ Caja Cerrada</h3><p>No hay sesión activa. Inicia caja para vender.</p>`;
                
                document.getElementById('seccionAbrir').style.display = 'block';
                document.getElementById('seccionCerrar').style.display = 'none';
            }

            function renderizarCajaAbierta(docId, data, vendido, esperado, numVentas) {
                const estadoDiv = document.getElementById('estadoCaja');
                estadoDiv.style.background = "rgba(100, 255, 100, 0.2)"; // Verde suave
                estadoDiv.style.border = "1px solid rgba(100, 255, 100, 0.4)";
                
                estadoDiv.innerHTML = `
                    <h3 style="margin-bottom:5px;">✅ Caja Abierta</h3>
                    <small>ID: ${docId}</small>
                `;

                document.getElementById('seccionAbrir').style.display = 'none';
                document.getElementById('seccionCerrar').style.display = 'block';

                document.getElementById('cierre_doc_id').value = docId;
                document.getElementById('cierre_fecha_apertura').textContent = data.fecha_apertura;
                document.getElementById('cierre_monto_inicial').textContent = parseFloat(data.monto_inicial || 0).toFixed(2);
                document.getElementById('cierre_total_vendido').textContent = vendido.toFixed(2);
                document.getElementById('cierre_num_ventas').textContent = numVentas;
                document.getElementById('cierre_total_esperado').textContent = esperado.toFixed(2);
                
                document.getElementById('cierre_monto_sistema_hidden').value = esperado.toFixed(2);
                document.getElementById('cierre_monto_inicial_hidden').value = parseFloat(data.monto_inicial || 0).toFixed(2);
            }

            // --- ABRIR CAJA ---
            async function abrirCaja(event) {
                event.preventDefault();
                const montoInicial = parseFloat(document.getElementById('monto_inicial_abrir').value || 0);
                
                // Obtenemos fechas
                const ahora = new Date();
                
                try {
                    const nuevaCaja = {
                        nombre_caja: 'Caja Principal',
                        monto_inicial: montoInicial,
                        fecha_apertura: ahora.toLocaleString(), // Para mostrar
                        fecha_apertura_iso: ahora.toISOString(), // IMPORTANTE: Para comparar matemáticamente
                        fecha_cierre: null,
                        cortes: [] 
                    };

                    await addDoc(cajasRef, nuevaCaja);
                    alert(`Caja abierta con éxito. Fondo: $${montoInicial.toFixed(2)}`);
                    verificarEstadoCaja(); 

                } catch (error) {
                    alert('Error: ' + error.message);
                }
            }

            // --- CERRAR CAJA ---
            async function cerrarCaja(event) {
                event.preventDefault();
                const docId = document.getElementById('cierre_doc_id').value;
                const montoContado = parseFloat(document.getElementById('monto_contado_cerrar').value || 0);
                const montoSistema = parseFloat(document.getElementById('cierre_monto_sistema_hidden').value || 0);
                const montoInicial = parseFloat(document.getElementById('cierre_monto_inicial_hidden').value || 0);

                if (!confirm(`Sistema espera: $${montoSistema}. ¿Cerrar con físico: $${montoContado}?`)) return;

                const ahora = new Date();

                try {
                    // 1. Marcar las ventas de esta sesión como "cortadas"
                    // Buscamos las mismas ventas que usamos para calcular el total
                    // NOTA: Para ser precisos, deberíamos buscar por fecha también, 
                    // pero al asignar id_corte, las "limpiamos" para la siguiente caja.
                    
                    const qVentasPendientes = query(ventasRef, where("id_corte", "==", null));
                    const snapshot = await getDocs(qVentasPendientes);
                    
                    // Actualizamos todas las ventas pendientes con el ID de este corte/caja
                    const updatePromises = [];
                    snapshot.forEach(docVenta => {
                        // Opcional: Verificar fecha de nuevo aquí si queremos ser muy estrictos
                        updatePromises.push(updateDoc(doc(db, "ventas", docVenta.id), { id_corte: docId }));
                    });
                    await Promise.all(updatePromises);

                    // 2. Registrar el corte en la caja
                    const corte = {
                        fecha_corte: ahora.toLocaleString(),
                        fecha_corte_iso: ahora.toISOString(),
                        monto_inicial: montoInicial,
                        monto_sistema: montoSistema,
                        monto_contado: montoContado,
                        desfase: montoContado - montoSistema
                    };
                    
                    await updateDoc(doc(db, "cajas", docId), {
                        fecha_cierre: corte.fecha_corte,
                        fecha_cierre_iso: corte.fecha_corte_iso,
                        cortes: [corte] 
                    });

                    alert(`Caja cerrada. Desfase: $${corte.desfase.toFixed(2)}`);
                    verificarEstadoCaja();

                } catch (error) {
                    console.error(error);
                    alert('Error al cerrar: ' + error.message);
                }
            }
        </script>
    </div>
</body>
</html>

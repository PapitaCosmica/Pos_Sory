<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta | POS Simple (Liquid Glass)</title>
    
    <link rel="stylesheet" href="styles.css"> 
    
    <style>
        /* MANTENEMOS TODOS TUS ESTILOS EXACTAMENTE IGUALES */
        body { 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            min-height: 100vh;
            color: #fff;
        }

        .main-container {
            max-width: 1200px;
            width: 95%;
            padding: 30px;
            box-shadow: none !important;
            background: none !important;
        }

        h1 { 
            color: #fff;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.4);
        }
        
        h2 {
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .container { 
            display: flex; 
            gap: 20px;
            width: 100%;
        }
        
        .panel-izquierdo, .panel-derecho { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            min-height: 600px;
        }

        .panel-izquierdo { flex: 2; }
        .panel-derecho { flex: 1; border-left: none; }
        
        .producto-card { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 15px; 
            margin-bottom: 10px; 
            cursor: pointer; 
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.2s; 
        }
        .producto-card:hover { 
            background: rgba(255, 255, 255, 0.15); 
            transform: translateY(-2px);
        }
        
        #listaVenta { list-style: none; padding: 0; margin-bottom: 20px; }
        #listaVenta li { 
            border-bottom: 1px dashed rgba(255, 255, 255, 0.3); 
            padding: 10px 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 1.1em;
        }
        .eliminar-item { 
            color: #ff6666; 
            cursor: pointer; 
            font-weight: bold; 
            margin-left: 15px; 
            transition: color 0.2s;
        }
        
        #totalVenta { color: #aaffaa; font-size: 1.8em; text-shadow: 0 0 5px rgba(0, 0, 0, 0.5); }
        
        select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px;
            border-radius: 5px;
            width: 100%;
            margin-top: 5px;
        }
        
        #filtroProductos { width: 100% !important; padding: 10px; margin-bottom: 15px; }
        
        #finalizarVentaBtn { 
            width: 100%;
            background-color: rgba(40, 167, 69, 0.5) !important;
            font-size: 1.1em;
        }
        .nav-bar { 
            margin-bottom: 20px; 
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .nav-bar a { margin: 0 10px; text-decoration: none; color: #87ceeb; }
    </style>
</head>
<body>
    <div class="main-container glass-container">
        
        <div class="nav-bar">
            <a href="index.html">Menú</a> |
            <a href="productos.html">Productos</a> |
            <a href="caja.html">Caja</a> |
            <a href="reportes.html">Reportes</a>
        </div>

        <h1>Punto de Venta</h1>

        <div id="cajaStatus">Cargando estado de caja...</div>

        <div class="container">
            <div class="panel-izquierdo">
                <h2>Búsqueda de Productos</h2>
                <input type="text" id="filtroProductos" placeholder="Escribe para buscar productos..." class="glass-input" autofocus>
                
                <div id="productosLista">
                    Empieza a escribir el nombre de un producto para buscarlo...
                </div>
            </div>

            <div class="panel-derecho">
                <h2>Venta Actual</h2>
                <ul id="listaVenta"></ul>
                
                <p>Subtotal: $<span id="subtotalVenta">0.00</span></p>
                <p>Impuestos (0%): $<span id="impuestosVenta">0.00</span></p>
                <h3>Total: $<strong id="totalVenta">0.00</strong></h3>

                <div style="margin-top: 20px;">
                    <label for="tipoPago">Tipo de Pago:</label>
                    <select id="tipoPago">
                        <option value="Efectivo">Efectivo</option>
                        <option value="Tarjeta">Tarjeta</option>
                    </select>
                </div>
                
                <button id="finalizarVentaBtn" class="glass-button" disabled>
                    Finalizar Venta
                </button>
            </div>
        </div>

        <script type="module">
            import { 
                db, collection, addDoc, getDocs, query, orderBy, where, doc, runTransaction, limit
            } from './firebase_init.js'; 

            const productosRef = collection(db, "productos");
            const ventasRef = collection(db, "ventas");
            const cajasRef = collection(db, "cajas");
            
            let idCajaAbierta = null;
            let carrito = []; 
            let productosMemoria = []; // Guardaremos los productos aquí para no pedirlos a Firebase a cada rato

            document.addEventListener('DOMContentLoaded', () => {
                verificarCajaAbierta();
                document.getElementById('finalizarVentaBtn').addEventListener('click', finalizarVenta);
                document.getElementById('filtroProductos').addEventListener('input', manejarBusqueda);
            });

            async function verificarCajaAbierta() {
                const statusDiv = document.getElementById('cajaStatus');
                try {
                    const q = query(cajasRef, where("fecha_cierre", "==", null), orderBy("fecha_apertura", "desc"), limit(1));
                    const snapshot = await getDocs(q);

                    if (snapshot.empty) {
                        idCajaAbierta = null;
                        statusDiv.innerHTML = '<p style="color: #ff6666; font-weight: bold;">❌ CAJA CERRADA. <a href="caja.html" style="color: #87ceeb;">Abrir Caja</a></p>';
                        document.getElementById('finalizarVentaBtn').disabled = true;
                    } else {
                        idCajaAbierta = snapshot.docs[0].id;
                        statusDiv.innerHTML = `<p style="color: #aaffaa; font-weight: bold;">✅ CAJA ABIERTA</p>`;
                        document.getElementById('finalizarVentaBtn').disabled = false;
                        descargarProductosAMemoria(); // Bajamos los datos al iniciar
                    }
                } catch (error) {
                    statusDiv.innerHTML = `<p style="color: #ff6666;">Error: ${error.message}</p>`;
                }
            }

            // Descarga los productos una sola vez para que la búsqueda sea instantánea
            async function descargarProductosAMemoria() {
                const q = query(productosRef, orderBy("nombre", "asc"));
                const snapshot = await getDocs(q);
                productosMemoria = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data(),
                    precio: parseFloat(doc.data().precio_venta || 0),
                    stock: parseInt(doc.data().stock || 0)
                })).filter(p => p.stock > 0); // Solo productos con stock
            }

            // Esta función filtra y RENDERIZA solo los necesarios (Máximo 15 para velocidad)
            function manejarBusqueda(e) {
                const listaDiv = document.getElementById('productosLista');
                const termino = e.target.value.toLowerCase().trim();

                if (termino === "") {
                    listaDiv.innerHTML = 'Empieza a escribir para buscar...';
                    return;
                }

                const filtrados = productosMemoria.filter(p => 
                    p.nombre.toLowerCase().includes(termino) || 
                    (p.codigo_barra && p.codigo_barra.toLowerCase().includes(termino))
                ).slice(0, 15); // Solo mostramos los primeros 15 resultados para que no haya lag

                listaDiv.innerHTML = '';
                if (filtrados.length === 0) {
                    listaDiv.innerHTML = 'No se encontraron productos.';
                    return;
                }

                filtrados.forEach(p => {
                    const card = document.createElement('div');
                    card.classList.add('producto-card');
                    card.innerHTML = `
                        <strong>${p.nombre}</strong><br>
                        Precio: $${p.precio.toFixed(2)} | Stock: ${p.stock}
                    `;
                    card.onclick = () => agregarACarrito(p.id);
                    listaDiv.appendChild(card);
                });
            }

            function agregarACarrito(productoId) {
                const producto = productosMemoria.find(p => p.id === productoId);
                if (!producto) return;

                const itemIndex = carrito.findIndex(item => item.id === productoId);

                if (itemIndex > -1) {
                    if (carrito[itemIndex].cantidad < producto.stock) {
                        carrito[itemIndex].cantidad += 1;
                    } else {
                        alert(`Stock insuficiente.`);
                        return;
                    }
                } else {
                    carrito.push({
                        id: productoId,
                        nombre: producto.nombre,
                        precio: producto.precio,
                        cantidad: 1
                    });
                }
                actualizarCarritoUI();
            }

            function actualizarCarritoUI() {
                const listaUI = document.getElementById('listaVenta');
                listaUI.innerHTML = '';
                let subtotal = 0;

                carrito.forEach(item => {
                    const totalItem = item.precio * item.cantidad;
                    subtotal += totalItem;
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>${item.nombre} x ${item.cantidad}</span>
                        <span>$${totalItem.toFixed(2)} <span class="eliminar-item" onclick="window.quitarDelCarrito('${item.id}')">X</span></span>
                    `;
                    listaUI.appendChild(li);
                });

                document.getElementById('totalVenta').textContent = subtotal.toFixed(2);
                document.getElementById('subtotalVenta').textContent = subtotal.toFixed(2);
                document.getElementById('finalizarVentaBtn').disabled = carrito.length === 0;
            }

            window.quitarDelCarrito = (id) => {
                carrito = carrito.filter(i => i.id !== id);
                actualizarCarritoUI();
            };

            async function finalizarVenta() {
                const total = parseFloat(document.getElementById('totalVenta').textContent);
                const tipoPago = document.getElementById('tipoPago').value;
                const btn = document.getElementById('finalizarVentaBtn');
                btn.disabled = true;

                try {
                    await runTransaction(db, async (transaction) => {
                        for (const item of carrito) {
                            const pRef = doc(db, "productos", item.id);
                            const pSnap = await transaction.get(pRef);
                            const nuevoStock = pSnap.data().stock - item.cantidad;
                            if (nuevoStock < 0) throw new Error(`Sin stock para ${item.nombre}`);
                            transaction.update(pRef, { stock: nuevoStock });
                        }
                        transaction.set(doc(ventasRef), {
                            id_corte: null,
                            fecha_hora: new Date().toLocaleString(),
                            total_venta: total,
                            tipo_pago: tipoPago
                        });
                    });

                    alert("Venta exitosa");
                    carrito = [];
                    actualizarCarritoUI();
                    document.getElementById('filtroProductos').value = '';
                    await descargarProductosAMemoria();
                    document.getElementById('productosLista').innerHTML = 'Empieza a escribir para buscar...';
                } catch (e) {
                    alert("Error: " + e.message);
                } finally {
                    btn.disabled = false;
                }
            }
        </script>
    </div>
</body>
</html>

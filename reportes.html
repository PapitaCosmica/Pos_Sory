<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes de Ventas</title>
    
    <link rel="stylesheet" href="styles.css"> 
    
    <style>
        /* Estilos específicos mínimos (el resto viene de styles.css) */
        .estado-positivo { color: #aaffaa; font-weight: bold; }
        .estado-negativo { color: #ff6666; font-weight: bold; }
        .estado-neutro { color: #87ceeb; font-weight: bold; }
    </style>
</head>
<body>
    <div class="glass-container">
        
        <div class="nav-bar">
            <a href="index.html">Menú</a> |
            <a href="venta.html">Venta</a> |
            <a href="productos.html">Productos</a> |
            <a href="caja.html">Caja</a>
        </div>

        <h2>📊 Reportes de Ventas y Cortes</h2>

        <div class="glass-panel">
            <h3>Ventas en la Sesión Actual (Sin Corte)</h3>
            <p>Total vendido en esta sesión: $<strong id="totalVendidoHoy" style="color: #aaffaa; font-size: 1.2em;">0.00</strong></p>
            <div style="overflow-x: auto;">
                <table id="tablaVentasHoy">
                    <thead>
                        <tr>
                            <th>Fecha/Hora</th>
                            <th>Total</th>
                            <th>Pago</th>
                            <th>ID Venta</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="4" style="text-align: center;">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="glass-panel">
            <h3>Historial de Cortes de Caja</h3>
            <div style="overflow-x: auto;">
                <table id="tablaCortes">
                    <thead>
                        <tr>
                            <th>Fecha Corte</th>
                            <th>Monto Inicial</th>
                            <th>Esperado</th>
                            <th>Real (Contado)</th>
                            <th>Desfase</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="5" style="text-align: center;">Cargando historial...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <script type="module">
            import { 
                db, collection, getDocs, query, where, orderBy, limit 
            } from './firebase_init.js'; 

            const ventasRef = collection(db, "ventas");
            const cajasRef = collection(db, "cajas");

            document.addEventListener('DOMContentLoaded', () => {
                cargarReporteVentasHoy();
                cargarHistorialCortes();
            });
            
            // --- FUNCIÓN DE FECHAS (IGUAL QUE EN CAJA.HTML) ---
            function parsearFecha(fechaStr) {
                try {
                    if (!fechaStr) return new Date(0);
                    if (fechaStr.includes('T')) return new Date(fechaStr);
                    // Intento de parseo local robusto
                    return new Date(Date.parse(fechaStr.replace('p. m.', 'PM').replace('a. m.', 'AM')));
                } catch (e) {
                    return new Date(0);
                }
            }

            // --- 1. CARGAR VENTAS DE LA SESIÓN ACTUAL (FILTRADAS) ---

            async function cargarReporteVentasHoy() {
                const tablaBody = document.querySelector('#tablaVentasHoy tbody');
                const totalLabel = document.getElementById('totalVendidoHoy');
                
                try {
                    // 1. Obtener la Caja Abierta para saber DESDE CUÁNDO sumar
                    const qCaja = query(cajasRef, where("fecha_cierre", "==", null), limit(1));
                    const snapCaja = await getDocs(qCaja);

                    if (snapCaja.empty) {
                        totalLabel.textContent = "0.00 (Caja Cerrada)";
                        tablaBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No hay caja abierta. Inicia sesión para ver ventas actuales.</td></tr>';
                        return;
                    }

                    const cajaData = snapCaja.docs[0].data();
                    
                    // Obtener fecha de apertura segura
                    let fechaApertura = new Date(cajaData.fecha_apertura_iso || 0);
                    if (fechaApertura.getTime() === 0) {
                         // Fallback para cajas viejas
                         fechaApertura = parsearFecha(cajaData.fecha_apertura);
                    }

                    // 2. Traer ventas pendientes
                    const qVentas = query(ventasRef, where("id_corte", "==", null), orderBy("fecha_hora", "desc"));
                    const snapshotVentas = await getDocs(qVentas);
                    
                    tablaBody.innerHTML = '';
                    let totalVendido = 0;
                    let ventasEncontradas = 0;

                    snapshotVentas.forEach(doc => {
                        const venta = doc.data();
                        
                        // FILTRO DE FECHA: Solo mostrar si es posterior a la apertura
                        let fechaVenta = new Date(venta.fecha_iso || 0);
                        if (fechaVenta.getTime() === 0) fechaVenta = parsearFecha(venta.fecha_hora);

                        // Si la venta es válida y es posterior o igual a la apertura
                        if (fechaVenta >= fechaApertura) {
                            const total = parseFloat(venta.total_venta || 0); 
                            totalVendido += total;
                            ventasEncontradas++;

                            const fila = tablaBody.insertRow();
                            fila.insertCell(0).textContent = venta.fecha_hora;
                            fila.insertCell(1).textContent = `$${total.toFixed(2)}`;
                            fila.insertCell(2).textContent = venta.tipo_pago;
                            fila.insertCell(3).textContent = doc.id.substring(0, 8) + '...'; // ID corto
                        }
                    });

                    if (ventasEncontradas === 0) {
                        tablaBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No hay ventas en esta sesión aún.</td></tr>';
                    }
                    
                    totalLabel.textContent = totalVendido.toFixed(2);

                } catch (error) {
                    console.error('Error:', error);
                    tablaBody.innerHTML = `<tr><td colspan="4" style="color: #ff6666;">Error: ${error.message}</td></tr>`;
                }
            }

            // --- 2. CARGAR HISTORIAL DE CORTES ---
            
            async function cargarHistorialCortes() {
                const tablaBody = document.querySelector('#tablaCortes tbody');
                
                try {
                    // Traemos las cajas cerradas (que tienen fecha_cierre)
                    const qCortes = query(cajasRef, where("fecha_cierre", "!=", null), orderBy("fecha_cierre", "desc"), limit(20)); // Limite 20 para no saturar
                    const snapshotCortes = await getDocs(qCortes);
                    
                    tablaBody.innerHTML = '';
                    
                    if (snapshotCortes.empty) {
                        tablaBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No hay cortes registrados.</td></tr>';
                        return;
                    }
                    
                    snapshotCortes.forEach(cajaDoc => {
                        const data = cajaDoc.data();
                        // Tomamos el último corte registrado en el array
                        const corte = data.cortes && data.cortes.length > 0 ? data.cortes[data.cortes.length - 1] : null; 

                        if (corte) {
                            const montoInicial = parseFloat(corte.monto_inicial || 0);
                            const montoSistema = parseFloat(corte.monto_sistema || 0);
                            const montoContado = parseFloat(corte.monto_contado || 0);
                            const desfase = montoContado - montoSistema;
                            
                            const fila = tablaBody.insertRow();
                            fila.insertCell(0).textContent = corte.fecha_corte;
                            fila.insertCell(1).textContent = `$${montoInicial.toFixed(2)}`;
                            fila.insertCell(2).textContent = `$${montoSistema.toFixed(2)}`;
                            fila.insertCell(3).textContent = `$${montoContado.toFixed(2)}`;
                            
                            // Colorear desfase
                            let claseColor = 'estado-neutro';
                            if (desfase > 0) claseColor = 'estado-positivo'; // Sobró dinero
                            if (desfase < -0.5) claseColor = 'estado-negativo'; // Faltó dinero (margen de 50 centavos)

                            fila.insertCell(4).innerHTML = `<span class="${claseColor}">$${desfase.toFixed(2)}</span>`;
                        }
                    });
                    
                } catch (error) {
                    console.error('Error historial:', error);
                    tablaBody.innerHTML = `<tr><td colspan="5" style="color: #ff6666;">Error: ${error.message}</td></tr>`;
                }
            }
        </script>
    </div>
    <script src="animations.js"></script>
</body>
</html>

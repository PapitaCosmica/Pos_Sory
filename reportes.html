<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes Semanales | POS Sory</title>
    <link rel="stylesheet" href="styles.css"> 
    <style>
        .filtros-container {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .paginacion-semanal {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 8px;
        }
        .estado-positivo { color: #aaffaa; }
        .estado-negativo { color: #ff6666; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body>
    <div class="glass-container" style="max-width: 1100px;">
        <div class="nav-bar">
            <a href="index.html">Menú</a> |
            <a href="venta.html">Venta</a> |
            <a href="productos.html">Productos</a> |
            <a href="caja.html">Caja</a>
        </div>

        <h2>📊 Reportes Semanales</h2>

        <div class="filtros-container">
            <div class="paginacion-semanal">
                <button id="btnSemanaAnt" class="glass-button" style="width: auto; margin:0;">⬅️ Semana Anterior</button>
                <div style="text-align: center; min-width: 200px;">
                    <span id="rangoFechas" style="font-weight: bold; font-size: 0.9em;">Cargando semana...</span>
                </div>
                <button id="btnSemanaSig" class="glass-button" style="width: auto; margin:0;">Siguiente ➡️</button>
            </div>

            <div style="display: flex; gap: 10px; align-items: center;">
                <span>Ir a:</span>
                <input type="date" id="filtroFecha" class="glass-input" style="width: auto; margin-bottom: 0;">
            </div>
        </div>

        <div class="glass-panel">
            <h3>Ventas del Periodo</h3>
            <p>Total vendido en esta semana: $<strong id="totalVendido" style="color: #aaffaa; font-size: 1.2em;">0.00</strong></p>
            <table id="tablaVentas">
                <thead>
                    <tr>
                        <th>Fecha/Hora</th>
                        <th>Total</th>
                        <th>Pago</th>
                    </tr>
                </thead>
                <tbody id="bodyVentas">
                    <tr><td colspan="3" style="text-align:center;">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="glass-panel">
            <h3>Cortes de Caja del Periodo</h3>
            <table id="tablaCortes">
                <thead>
                    <tr>
                        <th>Fecha Cierre</th>
                        <th>Sistema</th>
                        <th>Contado</th>
                        <th>Diferencia</th>
                    </tr>
                </thead>
                <tbody id="bodyCortes">
                    <tr><td colspan="4" style="text-align:center;">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

        <script type="module">
            import { db, collection, getDocs, query, orderBy, where } from './firebase_init.js'; 

            let fechaReferencia = new Date(); // Fecha actual para empezar
            let todasLasVentas = [];
            let todosLosCortes = [];

            document.addEventListener('DOMContentLoaded', () => {
                actualizarRangoYDatos();
                document.getElementById('btnSemanaAnt').addEventListener('click', () => moverSemana(-7));
                document.getElementById('btnSemanaSig').addEventListener('click', () => moverSemana(7));
                document.getElementById('filtroFecha').addEventListener('change', (e) => {
                    fechaReferencia = new Date(e.target.value + "T00:00:00");
                    actualizarRangoYDatos();
                });
            });

            function moverSemana(dias) {
                fechaReferencia.setDate(fechaReferencia.getDate() + dias);
                actualizarRangoYDatos();
            }

            async function actualizarRangoYDatos() {
                // Calcular inicio (hace 7 días) y fin (hoy) respecto a la referencia
                const fin = new Date(fechaReferencia);
                const inicio = new Date(fechaReferencia);
                inicio.setDate(fin.getDate() - 7);

                const opciones = { day: '2-digit', month: '2-digit', year: 'numeric' };
                document.getElementById('rangoFechas').textContent = `${inicio.toLocaleDateString('es-MX', opciones)} al ${fin.toLocaleDateString('es-MX', opciones)}`;
                
                // Deshabilitar botón "Siguiente" si ya estamos en la fecha actual
                const hoy = new Date();
                document.getElementById('btnSemanaSig').disabled = fin >= hoy;

                await descargarDatos(inicio, fin);
            }

            async function descargarDatos(fInicio, fFin) {
                const bodyV = document.getElementById('bodyVentas');
                const bodyC = document.getElementById('bodyCortes');
                bodyV.innerHTML = '<tr><td colspan="3" style="text-align:center;">Buscando ventas...</td></tr>';
                bodyC.innerHTML = '<tr><td colspan="4" style="text-align:center;">Buscando cortes...</td></tr>';

                try {
                    // Descargamos todo y filtramos localmente por simplicidad de formato de fecha
                    const vSnap = await getDocs(query(collection(db, "ventas"), orderBy("fecha_hora", "desc")));
                    const cSnap = await getDocs(query(collection(db, "cajas"), where("fecha_cierre", "!=", null), orderBy("fecha_cierre", "desc")));

                    // Filtrado Lógico por Rango de Fechas
                    const ventasFiltradas = vSnap.docs.map(d => d.data()).filter(v => {
                        const f = parsearFecha(v.fecha_iso || v.fecha_hora);
                        return f >= fInicio && f <= fFin;
                    });

                    const cortesFiltrados = cSnap.docs.map(d => d.data()).filter(c => {
                        const f = parsearFecha(c.fecha_cierre_iso || c.fecha_cierre);
                        return f >= fInicio && f <= fFin;
                    });

                    renderizarVentas(ventasFiltradas);
                    renderizarCortes(cortesFiltrados);
                } catch (e) { console.error(e); }
            }

            function parsearFecha(str) {
                if(!str) return new Date(0);
                if(str.includes('T')) return new Date(str);
                // Intento de parseo manual para el formato local dd/mm/yyyy
                const partes = str.split(',')[0].split('/');
                if(partes.length === 3) return new Date(partes[2], partes[1]-1, partes[0]);
                return new Date(str);
            }

            function renderizarVentas(lista) {
                const tbody = document.getElementById('bodyVentas');
                const totalTxt = document.getElementById('totalVendido');
                tbody.innerHTML = '';
                let suma = 0;

                lista.forEach(v => {
                    suma += parseFloat(v.total_venta || 0);
                    const fila = tbody.insertRow();
                    fila.innerHTML = `<td>${v.fecha_hora}</td><td>$${parseFloat(v.total_venta).toFixed(2)}</td><td>${v.tipo_pago}</td>`;
                });
                totalTxt.textContent = suma.toFixed(2);
                if(lista.length === 0) tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No hay ventas en esta semana</td></tr>';
            }

            function renderizarCortes(lista) {
                const tbody = document.getElementById('bodyCortes');
                tbody.innerHTML = '';
                lista.forEach(c => {
                    const corte = c.cortes[0];
                    const desfase = (corte.monto_contado || 0) - (corte.monto_sistema || 0);
                    const fila = tbody.insertRow();
                    fila.innerHTML = `
                        <td>${c.fecha_cierre}</td>
                        <td>$${parseFloat(corte.monto_sistema).toFixed(2)}</td>
                        <td>$${parseFloat(corte.monto_contado).toFixed(2)}</td>
                        <td class="${desfase < 0 ? 'estado-negativo' : 'estado-positivo'}">$${desfase.toFixed(2)}</td>
                    `;
                });
                if(lista.length === 0) tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Sin cortes en esta semana</td></tr>';
            }
        </script>
    </div>
    <script src="animations.js"></script>
</body>
</html>

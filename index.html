<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal | POS Sory</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Ajustes específicos para una UX superior en el Menú */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin-top: 30px;
            width: 100%;
        }

        .menu-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        /* Efecto de elevación y brillo al pasar el mouse */
        .menu-item:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5em;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .menu-item h3 {
            margin: 10px 0 5px 0;
            font-size: 1.4em;
            letter-spacing: 1px;
        }

        .menu-item p {
            font-size: 0.9em;
            opacity: 0.8;
            margin: 0;
            line-height: 1.4;
        }

        /* Alerta de stock optimizada */
        .alerta-container {
            width: 100%;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="glass-container" style="max-width: 1000px; padding: 50px;">
        <header style="text-align: center; margin-bottom: 40px;">
            <h1 style="font-size: 3em; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.3);">POS Sory</h1>
            <p style="opacity: 0.9; font-size: 1.1em;">Gestión Inteligente de Punto de Venta</p>
        </header>
        
        <div id="alertaStock" class="alerta-container">
            <div class="nav-bar" style="background: rgba(255, 70, 70, 0.4); border: 1px solid #ff4d4d; color: #fff;">
                <span style="font-weight: bold;">⚠️ AVISO DE INVENTARIO:</span> 
                Existen productos con stock agotado (0). 
                <a href="inventario.html" style="color: #fff; text-decoration: underline; margin-left: 10px;">Verificar ahora</a>
            </div>
        </div>

        <nav class="menu-grid">
            <a href="venta.html" class="glass-panel menu-item">
                <div class="icon-circle">🛒</div>
                <h3>VENTAS</h3>
                <p>Cobros y tickets</p>
            </a>

            <a href="inventario.html" class="glass-panel menu-item" style="border: 1px solid #87ceeb;">
                <div class="icon-circle" style="color: #87ceeb;">📋</div>
                <h3 style="color: #87ceeb;">AUDITORÍA</h3>
                <p>Control de stock físico</p>
            </a>

            <a href="productos.html" class="glass-panel menu-item">
                <div class="icon-circle">📦</div>
                <h3>PRODUCTOS</h3>
                <p>Catálogo y precios</p>
            </a>

            <a href="caja.html" class="glass-panel menu-item">
                <div class="icon-circle">🏦</div>
                <h3>CAJA</h3>
                <p>Apertura y cortes</p>
            </a>

            <a href="reportes.html" class="glass-panel menu-item">
                <div class="icon-circle">📈</div>
                <h3>REPORTES</h3>
                <p>Historial y ganancias</p>
            </a>
        </nav>
    </div>

    <script type="module">
        import { db, collection, getDocs, query, where } from './firebase_init.js';

        async function revisarStockCritico() {
            const alerta = document.getElementById('alertaStock');
            try {
                // Filtro para productos agotados
                const q = query(collection(db, "productos"), where("stock", "<=", 0));
                const snapshot = await getDocs(q);

                if (!snapshot.empty) {
                    alerta.style.display = 'block';
                }
            } catch (error) {
                console.error("Error al revisar stock:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', revisarStockCritico);
    </script>

    <script src="animations.js"></script>
</body>
</html>

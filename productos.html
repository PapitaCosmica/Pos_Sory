<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos | POS Sory</title>
    <link rel="stylesheet" href="styles.css"> 
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .paginacion-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; }
        .btn-pag { width: auto; padding: 8px 15px; min-width: 100px; }
        .categoria-badge { background: rgba(135, 206, 235, 0.3); padding: 2px 8px; border-radius: 4px; font-size: 0.85em; }
        #reader { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="glass-container" style="max-width: 1100px;">
        <div class="nav-bar">
            <a href="index.html">Menú</a> | <a href="venta.html">Venta</a> | <a href="caja.html">Caja</a> | <a href="reportes.html">Reportes</a>
        </div>

        <h2>📦 Gestión de Productos</h2>

        <div class="glass-panel" style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
            <button id="btnNuevoProducto" class="glass-button" style="width: auto; margin-top: 0;">➕ Nuevo Producto</button>
            <input type="text" id="filtroProductos" class="glass-input" placeholder="🔍 Buscar..." style="margin-bottom: 0; flex: 1;">
        </div>

        <div id="formularioProducto" class="glass-panel" style="display: none; max-width: 550px; margin: 20px auto;">
            <h3 id="tituloFormulario">Producto</h3>
            <form id="formProducto">
                <input type="hidden" id="doc_id"> 
                
                <label>Nombre:</label>
                <input type="text" id="nombre" required class="glass-input">

                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Precio:</label>
                        <input type="number" step="0.01" id="precio_venta" required class="glass-input">
                    </div>
                    <div style="flex: 1;">
                        <label>Stock:</label>
                        <input type="number" id="stock" required class="glass-input">
                    </div>
                </div>

                <label>Categoría:</label>
                <input type="text" id="categoria" class="glass-input" placeholder="Ej. Jabones">
                
                <label>Código de Barra:</label>
                <div class="input-group-row">
                    <input type="text" id="codigo_barra" class="glass-input">
                    <button type="button" id="btnScan" class="glass-button">📷</button>
                </div>

                <div id="reader" style="display:none;"></div>
                
                <div style="margin-top: 20px; text-align: right;">
                    <button type="button" onclick="ocultarFormulario()" class="glass-button glass-button-danger" style="width: auto;">Cancelar</button>
                    <button type="submit" class="glass-button" style="background: rgba(40, 167, 69, 0.4); width: auto;">Guardar</button>
                </div>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos"></tbody>
        </table>

        <div class="paginacion-container">
            <button id="btnAnt" class="glass-button btn-pag">⬅️ Anterior</button>
            <span id="infoPag">Página 1</span>
            <button id="btnSig" class="glass-button btn-pag">Siguiente ➡️</button>
        </div>
    </div>

    <script type="module">
        import { db, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from './firebase_init.js'; 

        let productosMemoria = [];
        let productosFiltrados = [];
        let paginaActual = 1;
        const itemsPorPagina = 10;
        
        // --- TU LÓGICA DE ESCÁNER ORIGINAL TAL CUAL ---
        let html5QrcodeScanner = null;

        function configurarEscaner() {
            const btnScan = document.getElementById('btnScan');
            
            btnScan.addEventListener('click', () => {
                const readerDiv = document.getElementById('reader');
                if (readerDiv.style.display === 'block') { detenerEscaner(); return; }
                
                readerDiv.style.display = 'block';
                html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 } }, false);
                
                html5QrcodeScanner.render((decodedText) => {
                    document.getElementById('codigo_barra').value = decodedText;
                    detenerEscaner();
                }, (err) => {});
            });
        }

        function detenerEscaner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    html5QrcodeScanner = null;
                });
            } else {
                document.getElementById('reader').style.display = 'none';
            }
        }

        // --- MANEJO DE DATOS Y PAGINACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            descargarDatos();
            configurarEscaner();
            document.getElementById('btnNuevoProducto').onclick = () => mostrarFormulario();
            document.getElementById('formProducto').onsubmit = guardarProducto;
            document.getElementById('filtroProductos').oninput = manejarBusqueda;
            document.getElementById('btnAnt').onclick = () => cambiarPagina(-1);
            document.getElementById('btnSig').onclick = () => cambiarPagina(1);
        });

        async function descargarDatos() {
            const snap = await getDocs(query(collection(db, "productos"), orderBy("nombre", "asc")));
            productosMemoria = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
            productosFiltrados = [...productosMemoria];
            renderizarTabla();
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tablaProductos');
            tbody.innerHTML = '';
            const data = productosFiltrados.slice((paginaActual - 1) * itemsPorPagina, paginaActual * itemsPorPagina);
            data.forEach(p => {
                const fila = tbody.insertRow();
                fila.innerHTML = `
                    <td><strong>${p.nombre}</strong><br><small>${p.codigo_barra || ''}</small></td>
                    <td><span class="categoria-badge">${p.categoria || 'General'}</span></td>
                    <td>$${parseFloat(p.precio_venta).toFixed(2)}</td>
                    <td>${p.stock}</td>
                    <td><span class="btn-accion" onclick='window.editarProducto(${JSON.stringify(p).replace(/'/g, "&apos;")})'>✏️</span></td>
                `;
            });
            document.getElementById('infoPag').textContent = `Página ${paginaActual} de ${Math.ceil(productosFiltrados.length / itemsPorPagina) || 1}`;
            document.getElementById('btnAnt').disabled = paginaActual === 1;
            document.getElementById('btnSig').disabled = paginaActual >= Math.ceil(productosFiltrados.length / itemsPorPagina);
        }

        function manejarBusqueda(e) {
            const t = e.target.value.toLowerCase();
            productosFiltrados = productosMemoria.filter(p => p.nombre.toLowerCase().includes(t) || (p.codigo_barra && p.codigo_barra.includes(t)) || (p.categoria && p.categoria.toLowerCase().includes(t)));
            paginaActual = 1; renderizarTabla();
        }

        function cambiarPagina(dir) { paginaActual += dir; renderizarTabla(); }

        window.mostrarFormulario = (datos = null) => {
            document.getElementById('formularioProducto').style.display = 'block';
            if (datos) {
                document.getElementById('doc_id').value = datos.docId;
                document.getElementById('nombre').value = datos.nombre;
                document.getElementById('precio_venta').value = datos.precio_venta;
                document.getElementById('stock').value = datos.stock;
                document.getElementById('categoria').value = datos.categoria || "";
                document.getElementById('codigo_barra').value = datos.codigo_barra || "";
            } else {
                document.getElementById('formProducto').reset();
                document.getElementById('doc_id').value = "";
            }
        };

        window.ocultarFormulario = () => {
            detenerEscaner();
            document.getElementById('formularioProducto').style.display = 'none';
        }

        async function guardarProducto(e) {
            e.preventDefault();
            const id = document.getElementById('doc_id').value;
            const data = {
                nombre: document.getElementById('nombre').value,
                precio_venta: parseFloat(document.getElementById('precio_venta').value),
                stock: parseInt(document.getElementById('stock').value),
                categoria: document.getElementById('categoria').value,
                codigo_barra: document.getElementById('codigo_barra').value
            };
            id ? await updateDoc(doc(db, "productos", id), data) : await addDoc(collection(db, "productos"), data);
            ocultarFormulario(); descargarDatos();
        }

        window.editarProducto = (p) => window.mostrarFormulario(p);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos | POS Simple</title>
    
    <link rel="stylesheet" href="styles.css"> 
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="glass-container">
        
        <div class="nav-bar">
            <a href="index.html">Menú</a> |
            <a href="venta.html">Venta</a> |
            <a href="caja.html">Caja</a> |
            <a href="reportes.html">Reportes</a>
        </div>

        <h2>📦 Gestión de Productos</h2>

        <button id="btnNuevoProducto" class="glass-button">➕ Agregar Nuevo Producto</button>

        <div id="formularioProducto" class="glass-panel" style="display: none; max-width: 500px;">
            <h3>Crear/Editar Producto</h3>
            <form id="formProducto">
                <input type="hidden" id="doc_id" name="doc_id"> 
                
                <label>Nombre:</label>
                <input type="text" id="nombre" name="nombre" required class="glass-input">

                <label>Precio Venta:</label>
                <input type="number" step="0.01" id="precio_venta" name="precio_venta" required class="glass-input">

                <label>Stock:</label>
                <input type="number" id="stock" name="stock" required class="glass-input">
                
                <label>Código de Barra:</label>
                <div class="input-group-row">
                    <input type="text" id="codigo_barra" name="codigo_barra" class="glass-input" placeholder="Escribe o escanea...">
                    <button type="button" id="btnScan" class="glass-button">📷</button>
                </div>

                <div id="reader" style="display:none;"></div>
                
                <div style="margin-top: 20px; text-align: right;">
                    <button type="button" onclick="window.ocultarFormulario()" class="glass-button glass-button-danger">Cancelar</button>
                    <button type="submit" class="glass-button" style="background: rgba(40, 167, 69, 0.4);">Guardar</button>
                </div>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID (Firestore)</th>
                    <th>Nombre</th>
                    <th>Precio Venta</th>
                    <th>Stock</th>
                    <th>Código</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos">
                <tr><td colspan="6" style="text-align:center;">Cargando productos...</td></tr>
            </tbody>
        </table>

        <script type="module">
            import { db, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from './firebase_init.js'; 

            const productosRef = collection(db, "productos");

            window.mostrarFormulario = mostrarFormulario;
            window.ocultarFormulario = ocultarFormulario;
            window.eliminarProducto = eliminarProducto;
            window.editarProducto = editarProducto;

            document.addEventListener('DOMContentLoaded', () => {
                cargarProductos();
                document.getElementById('btnNuevoProducto').addEventListener('click', mostrarFormulario);
                document.getElementById('formProducto').addEventListener('submit', guardarProducto);
                configurarEscaner();
            });

            // --- Lógica Escáner ---
            function configurarEscaner() {
                let html5QrcodeScanner = null;
                const btnScan = document.getElementById('btnScan');
                
                btnScan.addEventListener('click', () => {
                    const readerDiv = document.getElementById('reader');
                    if (readerDiv.style.display === 'block') { detenerEscaner(); return; }
                    
                    readerDiv.style.display = 'block';
                    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 } }, false);
                    
                    html5QrcodeScanner.render((decodedText) => {
                        document.getElementById('codigo_barra').value = decodedText;
                        detenerEscaner();
                    }, (err) => {});
                });

                function detenerEscaner() {
                    if (html5QrcodeScanner) {
                        html5QrcodeScanner.clear().then(() => {
                            document.getElementById('reader').style.display = 'none';
                            html5QrcodeScanner = null;
                        });
                    } else {
                        document.getElementById('reader').style.display = 'none';
                    }
                }
            }

            // --- Lógica CRUD ---
            function mostrarFormulario() {
                document.getElementById('doc_id').value = '';
                document.getElementById('nombre').value = '';
                document.getElementById('precio_venta').value = '';
                document.getElementById('stock').value = '';
                document.getElementById('codigo_barra').value = '';
                document.getElementById('formularioProducto').style.display = 'block'; 
            }

            function ocultarFormulario() {
                document.getElementById('formularioProducto').style.display = 'none';
            }

            async function cargarProductos() {
                const tablaBody = document.getElementById('tablaProductos');
                tablaBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Cargando...</td></tr>';

                try {
                    const snapshot = await getDocs(productosRef);
                    tablaBody.innerHTML = '';
                    
                    if (snapshot.empty) {
                        tablaBody.innerHTML = '<tr><td colspan="6">No hay productos registrados en Firestore.</td></tr>';
                        return;
                    }

                    snapshot.forEach(productoDoc => {
                        const producto = productoDoc.data();
                        const docId = productoDoc.id; 
                        const fila = tablaBody.insertRow();
                        
                        fila.insertCell(0).textContent = docId.substring(0, 8) + '...';
                        fila.insertCell(1).textContent = producto.nombre;
                        fila.insertCell(2).textContent = `$${parseFloat(producto.precio_venta || 0).toFixed(2)}`;
                        fila.insertCell(3).textContent = producto.stock;
                        fila.insertCell(4).textContent = producto.codigo_barra || 'N/A';
                        
                        const celdaAcciones = fila.insertCell(5);
                        const dataStr = JSON.stringify({docId, ...producto}).replace(/"/g, '&quot;');
                        celdaAcciones.innerHTML = `
                            <span class="btn-accion" onclick="window.editarProducto('${dataStr}')">✏️ Editar</span>
                            <span class="btn-accion" onclick="window.eliminarProducto('${docId}', '${producto.nombre}')">🗑️ Eliminar</span>
                        `;
                    });
                } catch (error) {
                    tablaBody.innerHTML = `<tr><td colspan="6" style="color:red;">Error: ${error.message}</td></tr>`;
                }
            }

            async function guardarProducto(e) {
                e.preventDefault();
                const docId = document.getElementById('doc_id').value;
                const data = {
                    nombre: document.getElementById('nombre').value,
                    precio_venta: parseFloat(document.getElementById('precio_venta').value),
                    stock: parseInt(document.getElementById('stock').value),
                    codigo_barra: document.getElementById('codigo_barra').value
                };

                try {
                    if (docId) await updateDoc(doc(db, "productos", docId), data);
                    else await addDoc(productosRef, data);
                    alert("Guardado con éxito");
                    ocultarFormulario();
                    cargarProductos();
                } catch(err) { alert(err.message); }
            }

            function editarProducto(json) {
                const p = JSON.parse(json);
                document.getElementById('doc_id').value = p.docId;
                document.getElementById('nombre').value = p.nombre;
                document.getElementById('precio_venta').value = p.precio_venta;
                document.getElementById('stock').value = p.stock;
                document.getElementById('codigo_barra').value = p.codigo_barra;
                mostrarFormulario();
            }

            async function eliminarProducto(id, nombre) {
                if(confirm(`¿Eliminar ${nombre}?`)) {
                    await deleteDoc(doc(db, "productos", id));
                    cargarProductos();
                }
            }
        </script>
    </div>
    <script src="animations.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos | POS Sory</title>
    <link rel="stylesheet" href="styles.css"> 
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="glass-container">
        <div class="nav-bar">
            <a href="index.html">Menú</a> |
            <a href="venta.html">Venta</a> |
            <a href="caja.html">Caja</a> |
            <a href="reportes.html">Reportes</a>
        </div>

        <h2>📦 Gestión de Productos</h2>

        <div class="glass-panel" style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
            <button id="btnNuevoProducto" class="glass-button" style="width: auto; margin-top: 0;">➕ Nuevo Producto</button>
            <input type="text" id="buscadorProductos" class="glass-input" placeholder="🔍 Buscar por nombre o código..." style="margin-bottom: 0; flex: 1; min-width: 200px;">
        </div>

        <div id="formularioProducto" class="glass-panel" style="display: none; max-width: 500px; margin: 20px auto;">
            <h3 id="tituloFormulario">Crear Producto</h3>
            <form id="formProducto">
                <input type="hidden" id="doc_id" name="doc_id"> 
                
                <label>Nombre:</label>
                <input type="text" id="nombre" name="nombre" required class="glass-input">

                <label>Precio Venta:</label>
                <input type="number" step="0.01" id="precio_venta" name="precio_venta" required class="glass-input">

                <label>Stock:</label>
                <input type="number" id="stock" name="stock" required class="glass-input">
                
                <label>Código de Barra:</label>
                <div class="input-group-row">
                    <input type="text" id="codigo_barra" name="codigo_barra" class="glass-input" placeholder="Escribe o escanea...">
                    <button type="button" id="btnScan" class="glass-button">📷</button>
                </div>

                <div id="reader" style="display:none;"></div>
                
                <div style="margin-top: 20px; text-align: right;">
                    <button type="button" onclick="window.ocultarFormulario()" class="glass-button glass-button-danger">Cancelar</button>
                    <button type="submit" class="glass-button" style="background: rgba(40, 167, 69, 0.4);">Guardar Cambios</button>
                </div>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Código</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos">
                <tr><td colspan="5" style="text-align:center;">Cargando productos...</td></tr>
            </tbody>
        </table>

        <script type="module">
            import { db, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from './firebase_init.js'; 

            const productosRef = collection(db, "productos");

            window.mostrarFormulario = mostrarFormulario;
            window.ocultarFormulario = ocultarFormulario;
            window.eliminarProducto = eliminarProducto;
            window.editarProducto = editarProducto;

            document.addEventListener('DOMContentLoaded', () => {
                cargarProductos();
                document.getElementById('btnNuevoProducto').addEventListener('click', () => mostrarFormulario());
                document.getElementById('formProducto').addEventListener('submit', guardarProducto);
                document.getElementById('buscadorProductos').addEventListener('input', filtrarProductos);
                configurarEscaner();
            });

            // --- BUSCADOR ---
            function filtrarProductos(e) {
                const termino = e.target.value.toLowerCase();
                const filas = document.querySelectorAll('#tablaProductos tr');
                filas.forEach(fila => {
                    const texto = fila.innerText.toLowerCase();
                    fila.style.display = texto.includes(termino) ? "" : "none";
                });
            }

            // --- LÓGICA DE FORMULARIO ---
            function mostrarFormulario(datos = null) {
                const form = document.getElementById('formularioProducto');
                const titulo = document.getElementById('tituloFormulario');
                
                if (datos) {
                    titulo.textContent = "Editar Producto";
                    document.getElementById('doc_id').value = datos.docId;
                    document.getElementById('nombre').value = datos.nombre;
                    document.getElementById('precio_venta').value = datos.precio_venta;
                    document.getElementById('stock').value = datos.stock;
                    document.getElementById('codigo_barra').value = datos.codigo_barra || "";
                } else {
                    titulo.textContent = "Crear Producto";
                    document.getElementById('formProducto').reset();
                    document.getElementById('doc_id').value = "";
                }
                form.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function ocultarFormulario() {
                document.getElementById('formularioProducto').style.display = 'none';
                document.getElementById('formProducto').reset();
            }

            async function cargarProductos() {
                const tablaBody = document.getElementById('tablaProductos');
                try {
                    const q = query(productosRef, orderBy("nombre", "asc"));
                    const snapshot = await getDocs(q);
                    tablaBody.innerHTML = '';
                    snapshot.forEach(productoDoc => {
                        const p = productoDoc.data();
                        const docId = productoDoc.id;
                        const fila = tablaBody.insertRow();
                        fila.innerHTML = `
                            <td><strong>${p.nombre}</strong></td>
                            <td>$${parseFloat(p.precio_venta).toFixed(2)}</td>
                            <td>${p.stock}</td>
                            <td>${p.codigo_barra || '-'}</td>
                            <td>
                                <span class="btn-accion" onclick='window.editarProducto(${JSON.stringify({docId, ...p}).replace(/'/g, "&apos;")})'>✏️ Editar</span>
                                <span class="btn-accion" style="color:#ff6666;" onclick="window.eliminarProducto('${docId}', '${p.nombre}')">🗑️ Borrar</span>
                            </td>
                        `;
                    });
                } catch (error) { console.error(error); }
            }

            // --- SOLUCIÓN AL DUPLICADO ---
            async function guardarProducto(e) {
                e.preventDefault();
                const docId = document.getElementById('doc_id').value;
                const data = {
                    nombre: document.getElementById('nombre').value,
                    precio_venta: parseFloat(document.getElementById('precio_venta').value),
                    stock: parseInt(document.getElementById('stock').value),
                    codigo_barra: document.getElementById('codigo_barra').value
                };

                try {
                    if (docId) {
                        // Si hay docId, actualizamos el documento existente en lugar de crear uno nuevo
                        await updateDoc(doc(db, "productos", docId), data);
                    } else {
                        await addDoc(productosRef, data);
                    }
                    ocultarFormulario();
                    cargarProductos();
                } catch(err) { alert("Error: " + err.message); }
            }

            function editarProducto(datos) {
                mostrarFormulario(datos);
            }

            async function eliminarProducto(id, nombre) {
                if(confirm(`¿Eliminar ${nombre}?`)) {
                    await deleteDoc(doc(db, "productos", id));
                    cargarProductos();
                }
            }

            function configurarEscaner() {
                let scanner = null;
                document.getElementById('btnScan').addEventListener('click', () => {
                    const reader = document.getElementById('reader');
                    if (reader.style.display === 'block') {
                        if (scanner) scanner.clear();
                        reader.style.display = 'none';
                        return;
                    }
                    reader.style.display = 'block';
                    scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                    scanner.render(text => {
                        document.getElementById('codigo_barra').value = text;
                        scanner.clear();
                        reader.style.display = 'none';
                    });
                });
            }
        </script>
    </div>
    <script src="animations.js"></script>
</body>
</html>
